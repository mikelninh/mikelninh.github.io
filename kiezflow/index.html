function showAbout(){const dialog=$('#about-dialog');$('#dialog-body').innerHTML=`<h2 id="about-title">Das Modell hinter der Magie.</h2><p>KIEZFLOW v1.0 ist eine unabhängige, nicht offizielle Arbeitsprobe. Wir simulieren Ablagerungsmeldungen und Teams in einer achtstündigen Schicht – nicht den echten BSR-Betrieb.</p><div class="code">Verfügbare Teams = Teams − Ausfälle<br>Fahrtzeit ≈ Luftlinie / 18 km/h + 5 Minuten<br>Bearbeitungszeit ≈ angenommener Abfalltyp × Faktor<br>Heuristische Priorität = Dringlichkeit + Wartezeit − Reisezeit</div><p>Das Schichtmodell ist deterministisch. Es nimmt für Prognosen an, dass nicht gefährliche Fälle hypothetisch freigegeben sind. Die operative Ansicht dagegen erzwingt explizite menschliche Entscheidungen, blockiert Gefahrstoff-Hinweise und protokolliert Statusänderungen.</p><p>Dubletten-Hinweise beruhen auf Zeichen-N-Grammen, Standortnähe und Abfalltyp. Der Match-Score ist keine Wahrscheinlichkeit, und die Schwellenwerte wurden nicht an realen Daten kalibriert.</p><p>Für ein echtes Produkt wären insbesondere realistische Verkehrs- und Fahrzeugdaten, Einsatzregeln, Fachbereichsvalidierung, Rollenrechte, revisionssicheres Audit, Sicherheitstests und eine Evaluation mit Pilotmetriken nötig.</p><p><strong>Geografische Quelle:</strong> Vereinfachte öffentlich verfügbare Bezirksgrenzen aus dem Projekt <a href="https://github.com/funkeinteraktiv/Berlin-Geodaten" target="_blank" rel="noopener noreferrer">Berlin-Geodaten</a> (CC BY 3.0 DE; ursprüngliche Daten: Amt für Statistik Berlin-Brandenburg). Positionen und Strecken sind rein illustrativ.</p><p>Erstellt als Arbeitsprobe für die Rolle AI Solution Engineer. Alle betrieblichen Werte und Vorgänge sind synthetisch. Keine Anbindung, Zusammenarbeit oder Empfehlung durch die BSR wird behauptet.</p>`;if(!dialog.open)dialog.showModal();}

 if(compareDrag&&e.pointerId===compareDrag.id){const stage=$('.p6-stage-map'),r=stage?.getBoundingClientRect();if(r)setReveal((e.clientX-r.left)/r.width*100);return;}
 if(!pulseDrag||e.pointerId!==pulseDrag.id)return;
 if(Math.hypot(e.clientX-pulseDrag.x,e.clientY-pulseDrag.y)>8)pulseDrag.moved=true;
 if(!pulseDrag.moved)return;
 let ghost=$('#pulse-drag-ghost');if(!ghost){ghost=document.createElement('div');ghost.id='pulse-drag-ghost';ghost.className='p6-dragging-ghost';ghost.textContent='✳  RESERVE · TEAM 05';document.body.appendChild(ghost);}
 ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
});
document.addEventListener('pointerup',e=>{
 if(compareDrag&&e.pointerId===compareDrag.id){compareDrag=null;save();return;}
 if(!pulseDrag||e.pointerId!==pulseDrag.id)return;
 const moved=pulseDrag.moved; pulseDrag=null;$('#pulse-drag-ghost')?.remove();
 if(!moved)return;
 const arr=document.elementsFromPoint(e.clientX,e.clientY),zone=arr.find(x=>x.closest?.('[data-pulse-zone]'))?.closest('[data-pulse-zone]');
 if(zone){pulseSelectPlace(zone.dataset.pulseZone);return;}
 const map=arr.find(x=>x.closest?.('.p6-map-graphic'))?.closest('.p6-map-graphic'); const svg=map?.querySelector('svg');
 if(svg){
   const point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;
   const matrix=svg.getScreenCTM();if(matrix){const loc=point.matrixTransform(matrix.inverse());
     const zones=Object.entries(E.RESERVE_ZONES).map(([name,coords])=>({name,d:Math.hypot(coord(coords).x-loc.x,coord(coords).y-loc.y)})).sort((a,b)=>a.d-b.d);
     if(zones[0]){pulseSelectPlace(zones[0].name);return;}
   }
 }
 notice('Ziehe das Team auf die Karte oder tippe auf einen Bezirk.');
});
document.addEventListener('pointercancel',()=>{compareDrag=null;pulseDrag=null;$('#pulse-drag-ghost')?.remove();});
$('#street-dialog').addEventListener('click',e=>{if(e.target.id==='street-dialog')$('#street-dialog').close();});
$('#about-dialog').addEventListener('click',e=>{if(e.target.id==='about-dialog')$('#about-dialog').close();});
render();
})();

</script>
</body>
