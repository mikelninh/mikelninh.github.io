name: Interactive hiring proof QA

on:
  push:
    branches: [main]
    paths:
      - 'almedia/**'
      - 'agents/**'
      - 'pruefpilot/**'
      - '.github/workflows/proof-experience-qa.yml'
  pull_request:
    paths:
      - 'almedia/**'
      - 'agents/**'
      - 'pruefpilot/**'
      - '.github/workflows/proof-experience-qa.yml'
  workflow_dispatch:

jobs:
  proof-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Test application proofs
        run: |
          mkdir -p artifacts/proof-experience
          python - <<'PY'
          import subprocess,time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
            time.sleep(.5)
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':1000})
              errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))

              # Almedia: real synthetic self-service data flow.
              page.goto('http://127.0.0.1:8765/almedia/',wait_until='networkidle')
              assert 'Turn repeated data requests into self-service' in page.locator('h1').inner_text()
              for path in ['campaign_spend.json','verified_outcomes.json','revenue.json']:
                response=page.request.get(f'http://127.0.0.1:8765/almedia/data/{path}')
                assert response.ok, path
                assert response.json()['fixture']=='synthetic'
              page.screenshot(path='artifacts/proof-experience/almedia-start.png',full_page=True)
              page.locator('#run').click()
              page.locator('#result.show').wait_for(state='visible',timeout=5000)
              result=page.locator('#result').inner_text()
              assert 'Pocket Arena needs attention' in result
              assert '0.86×' in result
              assert '€9.88' in result
              assert 'campaign_id' in result
              page.screenshot(path='artifacts/proof-experience/almedia-result.png',full_page=True)
              page.locator('#break').click()
              assert page.locator('#sRevenue').inner_text().lower()=='removed'
              assert page.locator('#fail.show').is_visible()
              page.locator('#run').click()
              assert 'Cannot calculate ROAS' in page.locator('#fail').inner_text()
              assert page.locator('#result.show').count()==0
              page.screenshot(path='artifacts/proof-experience/almedia-blocked.png',full_page=True)

              # HausPilot: bounded workflow + fail-closed proof.
              page.goto('http://127.0.0.1:8765/agents/',wait_until='networkidle')
              assert 'Turn a tenant request' in page.locator('h1').inner_text()
              assert page.locator('#preview.show').count()==0
              assert page.locator('#nextCase').is_hidden()
              page.screenshot(path='artifacts/proof-experience/agents-start.png',full_page=True)
              page.locator('#run').click()
              page.locator('#output.show').wait_for(state='visible',timeout=5000)
              txt=page.locator('#output').inner_text().lower()
              assert 'ready for review' in txt and 'nothing sent' in txt
              assert 'handling time' in page.locator('#measure').inner_text().lower()
              page.locator('#break').click()
              assert "can't continue" in page.locator('#outTitle').inner_text().lower()
              assert page.locator('.record.removed').count()==1
              assert 'property cannot be verified' in page.locator('#output').inner_text().lower()
              assert page.locator('#nextCase').is_visible()
              page.screenshot(path='artifacts/proof-experience/agents-broken.png',full_page=True)
              page.locator('#nextCase').click()
              assert '€1,248.50' in page.locator('#caseTitle').inner_text()

              # PrüfPilot: document self-service + evidence inspection.
              page.goto('http://127.0.0.1:8765/pruefpilot/',wait_until='networkidle')
              assert 'Give it the document pack' in page.locator('h1').inner_text()
              assert page.locator('#result.show').count()==0
              page.screenshot(path='artifacts/proof-experience/pruefpilot-start.png',full_page=True)
              page.locator('#run').click()
              page.locator('#result.show').wait_for(state='visible',timeout=5000)
              ptxt=page.locator('#result').inner_text()
              assert 'Not ready for approval' in ptxt
              assert '€300' in ptxt
              page.locator('#why').click()
              assert page.locator('#evidence.show').is_visible()
              assert 'Requirement list expects 5 items' in page.locator('#evidence').inner_text()
              page.locator('[data-case="travel"]').click()
              page.locator('#run').click()
              page.locator('#result.show').wait_for(state='visible',timeout=5000)
              assert 'Needs correction' in page.locator('#result').inner_text()
              assert '€144' in page.locator('#result').inner_text()
              page.screenshot(path='artifacts/proof-experience/pruefpilot-result.png',full_page=True)

              mobile=b.new_page(viewport={'width':390,'height':844})
              mobile.goto('http://127.0.0.1:8765/almedia/',wait_until='networkidle')
              assert mobile.locator('#run').is_visible()
              mobile.screenshot(path='artifacts/proof-experience/mobile-almedia.png',full_page=True)
              mobile.goto('http://127.0.0.1:8765/agents/',wait_until='networkidle')
              assert mobile.locator('#run').is_visible()
              mobile.screenshot(path='artifacts/proof-experience/mobile-agents.png',full_page=True)
              mobile.goto('http://127.0.0.1:8765/pruefpilot/',wait_until='networkidle')
              assert mobile.locator('#run').is_visible()
              mobile.screenshot(path='artifacts/proof-experience/mobile-pruefpilot.png',full_page=True)
              assert not errors,errors
              b.close()
          finally:
            server.terminate();server.wait(timeout=5)
          print('Application proof QA: OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-proof-visual-qa
          path: artifacts/proof-experience/
          if-no-files-found: error
