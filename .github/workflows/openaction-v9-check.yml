name: OpenAction V10 UI checks
on:
  push:
    branches: [main, 'feat/openaction-**']
    paths: ['openaction/workspace/**', '.github/workflows/openaction-v9-check.yml']
  pull_request:
    paths: ['openaction/workspace/**', '.github/workflows/openaction-v9-check.yml']
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check openaction/workspace/v10-data.js
      - run: node --check openaction/workspace/v10-app.js
      - run: grep -q 'Trust & Control · V10' openaction/workspace/index.html
      - run: grep -q 'Shared Now · für alle identisch' openaction/workspace/index.html
      - run: grep -q 'Fertig wenn' openaction/workspace/index.html
      - run: grep -q 'Prüft / bestätigt' openaction/workspace/index.html
      - run: grep -q 'Gesamten Weg ansehen' openaction/workspace/index.html
      - run: grep -q 'Geld & Mittel verfolgen' openaction/workspace/index.html
      - run: grep -q 'Trust, Änderungen & Konflikte' openaction/workspace/index.html
      - run: grep -q 'Proof' openaction/workspace/index.html
      - run: grep -q 'Audit / Rechnungshof' openaction/workspace/v10-data.js
      - run: grep -q 'submitted' openaction/workspace/v10-app.js
      - run: grep -q 'rejected' openaction/workspace/v10-app.js
