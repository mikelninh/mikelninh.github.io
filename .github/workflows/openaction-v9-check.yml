name: OpenAction V9 UI checks
on:
  push:
    branches: [main, 'feat/openaction-**']
    paths: ['openaction/workspace/**', '.github/workflows/openaction-v9-check.yml']
  pull_request:
    paths: ['openaction/workspace/**', '.github/workflows/openaction-v9-check.yml']
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check openaction/workspace/v9.js
      - run: node --check openaction/workspace/v9-fixes.js
      - run: grep -q 'Verified State · V9' openaction/workspace/index.html
      - run: grep -q 'Gesamten Weg ansehen' openaction/workspace/index.html
      - run: grep -q 'Geld & Mittel verfolgen' openaction/workspace/index.html
      - run: grep -q 'Evidence & Audit' openaction/workspace/index.html
