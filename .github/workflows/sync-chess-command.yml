# Sync tested Chess Command build.
name: Sync Chess Command demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-chess-command.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio site
        uses: actions/checkout@v4
        with:
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Chess Command
        uses: actions/checkout@v4
        with:
          repository: mikelninh/chess-command
          ref: main
          path: source
      - name: Copy tested Chess Command web app
        run: |
          rm -rf site/chess-command
          mkdir -p site/chess-command
          cp source/index.html site/chess-command/
          cp source/chess-styles.css site/chess-command/
          cp source/piece-skin.css site/chess-command/
          cp source/learning-v5.css site/chess-command/
          cp source/review-v11.css site/chess-command/
          cp source/coach-v10.css site/chess-command/
          cp source/puzzle-v12.css site/chess-command/
          cp source/puzzle-modes-v18.css site/chess-command/
          cp source/puzzle-mobile-v19.css site/chess-command/
          cp source/viewport-v20.css site/chess-command/
          cp source/clarity-v21.css site/chess-command/
          cp source/opening-v14.css site/chess-command/
          cp source/gamefeel-v17.css site/chess-command/
          cp source/progress-v18.css site/chess-command/
          cp source/mobile.css site/chess-command/
          cp source/chess-core.js site/chess-command/
          cp source/coach-core.js site/chess-command/
          cp source/review-core-v11.js site/chess-command/
          cp source/puzzle-core-v12.js site/chess-command/
          cp source/puzzle-pack-v15.js site/chess-command/
          cp source/puzzle-pack-lichess-v16.js site/chess-command/
          cp source/puzzle-provider-v16.js site/chess-command/
          cp source/data.js site/chess-command/
          cp source/stockfish-bridge.js site/chess-command/
          cp source/chess-app.js site/chess-command/
          cp source/learning-v5.js site/chess-command/
          cp source/review-v11.js site/chess-command/
          cp source/coach-v10.js site/chess-command/
          cp source/puzzle-v12.js site/chess-command/
          cp source/puzzle-modes-v18.js site/chess-command/
          cp source/puzzle-mobile-v12.js site/chess-command/
          cp source/opening-v14.js site/chess-command/
          cp source/gamefeel-v17.js site/chess-command/
          cp source/progress-v18.js site/chess-command/
          cp source/layout-v20.js site/chess-command/
          cp source/clarity-v21.js site/chess-command/
          cp source/piece-skin.js site/chess-command/
          cp source/mobile-ui.js site/chess-command/
          cp source/pwa-init.js site/chess-command/
          cp source/sw.js site/chess-command/
          cp source/pieces.svg site/chess-command/
          cp source/manifest.webmanifest site/chess-command/
          cp source/chess-command-icon.svg site/chess-command/
          touch site/chess-command/.nojekyll
      - name: Commit synced demo
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chess-command
          if git diff --cached --quiet; then
            echo 'Chess Command demo already current.'
            exit 0
          fi
          git commit -m 'Sync premium clarity Chess Command build'
          git push
