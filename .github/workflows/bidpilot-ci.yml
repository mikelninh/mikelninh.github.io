name: BIDPILOT quality gates
on:
  pull_request:
    paths:
      - "bidpilot/**"
      - ".github/workflows/bidpilot-ci.yml"
  push:
    branches: [main]
    paths:
      - "bidpilot/**"
      - ".github/workflows/bidpilot-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check bidpilot/app.js
      - name: Test TED ingestion, notice types, lot dates and pagination
        run: python -m unittest discover -s bidpilot -p "test_*.py" -v
      - name: Test shortlist ranking and browser workflow without external dependencies
        run: node --test bidpilot/test_*.cjs
