name: Cohere proof readability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-cohere-fde-readability.mjs'
      - '.github/workflows/cohere-readability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply readability pass
        run: node scripts/polish-cohere-fde-readability.mjs
      - name: Commit generated page
        run: |
          if git diff --quiet -- cohere-fde/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cohere-fde/index.html
          git commit -m 'Polish Cohere proof readability'
          git push
