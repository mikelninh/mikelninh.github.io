name: Publish OUT OF PANEL 0.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/out-of-panel-06-release.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: out-of-panel-06-release
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build portable experience (no external runtime scripts)
        run: |
          set -euo pipefail
          python3 beyond-cv/out-of-panel/source/build.py
          node --check beyond-cv/out-of-panel/source/release06.js
          node --check beyond-cv/out-of-panel/source/app.js
          node --check beyond-cv/out-of-panel/source/journey.js
          node --check beyond-cv/out-of-panel/source/qa06.mjs
          grep -q 'oop06-feedback' beyond-cv/out-of-panel/index.html
          grep -q 'out-of-panel-v06' beyond-cv/out-of-panel/index.html
      - name: Install browser test runtime
        run: |
          mkdir -p /tmp/oop06-tests
          npm install --prefix /tmp/oop06-tests playwright@1.58.2
          /tmp/oop06-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve 0.5 game, comic and 3D interactions
        env:
          PLAYWRIGHT_MODULE: /tmp/oop06-tests/node_modules/playwright/index.mjs
        run: node beyond-cv/out-of-panel/source/qa05.mjs
      - name: Verify 0.6 feedback, sharing and mobile behavior
        env:
          PLAYWRIGHT_MODULE: /tmp/oop06-tests/node_modules/playwright/index.mjs
        run: node beyond-cv/out-of-panel/source/qa06.mjs
      - name: Summarize 0.6 browser failures
        if: failure()
        run: |
          cat beyond-cv/out-of-panel/source/qa06-artifacts/QA06.json || true
      # Use HEAD of main for the complete patched 0.7 experience.
      - name: Capture 0.7 real browser moments and mobile performance
        env:
          PLAYWRIGHT_MODULE: /tmp/oop06-tests/node_modules/playwright/index.mjs
        run: node beyond-cv/out-of-panel/source/qa07.mjs
      - name: Convert authentic walkthrough to a small MP4
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -y -i beyond-cv/out-of-panel/source/qa07-artifacts/real-teaser.webm -t 10 -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p -movflags +faststart beyond-cv/out-of-panel/source/qa07-artifacts/real-teaser.mp4
          else
            echo "ffmpeg unavailable: retain original WebM only"
          fi
      - name: Verify private API rejects anonymous dashboard reads
        run: |
          set -euo pipefail
          code="$(curl -L -sS --max-time 20 -o /tmp/oop07admin -w '%{http_code}' -H 'Origin: https://mikelninh.github.io' https://htffcvdopavknnylbowl.supabase.co/functions/v1/out-of-panel-admin)"
          test "$code" = "401"
          echo "Anonymous admin read blocked by backend (401)."
      - name: Save browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-of-panel-06-review
          path: |
            beyond-cv/out-of-panel/source/qa05-artifacts/
            beyond-cv/out-of-panel/source/qa06-artifacts/
            beyond-cv/out-of-panel/source/qa07-artifacts/
          retention-days: 14
      - name: Check mobile share control in the gate
        run: |
          grep -q "'#share-footer'" beyond-cv/out-of-panel/source/qa06.mjs
          grep -q '44px touch targets' beyond-cv/out-of-panel/source/release06.css
      - name: Commit gated public release
        shell: bash
        run: |
          set -euo pipefail
          cp beyond-cv/out-of-panel/source/qa06-artifacts/QA06.json beyond-cv/out-of-panel/QA-results-06.json
          cp beyond-cv/out-of-panel/source/qa07-artifacts/QA07.json beyond-cv/out-of-panel/QA-results-07.json
          cp beyond-cv/out-of-panel/source/qa07-artifacts/performance.json beyond-cv/out-of-panel/mobile-emulation-results.json
          cp beyond-cv/out-of-panel/source/qa07-artifacts/social-preview.png beyond-cv/out-of-panel/social-preview.png
          cp beyond-cv/out-of-panel/source/qa07-artifacts/rooftop-real.png beyond-cv/out-of-panel/rooftop-real.png
          cp beyond-cv/out-of-panel/source/qa07-artifacts/coin-real.png beyond-cv/out-of-panel/coin-real.png
          cp beyond-cv/out-of-panel/source/qa07-artifacts/real-teaser.webm beyond-cv/out-of-panel/real-teaser.webm
          if test -f beyond-cv/out-of-panel/source/qa07-artifacts/real-teaser.mp4; then cp beyond-cv/out-of-panel/source/qa07-artifacts/real-teaser.mp4 beyond-cv/out-of-panel/real-teaser.mp4; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+mikelninh@users.noreply.github.com'
          git add -- beyond-cv/out-of-panel/index.html beyond-cv/out-of-panel/QA-results-06.json beyond-cv/out-of-panel/QA-results-07.json beyond-cv/out-of-panel/mobile-emulation-results.json beyond-cv/out-of-panel/social-preview.png beyond-cv/out-of-panel/rooftop-real.png beyond-cv/out-of-panel/coin-real.png beyond-cv/out-of-panel/real-teaser.webm
          if test -f beyond-cv/out-of-panel/real-teaser.mp4; then git add -- beyond-cv/out-of-panel/real-teaser.mp4; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Release OUT OF PANEL 0.7: real screenshots, mobile QA and private listening room'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Dispatch Github Pages deployment after gated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
          echo "Pages deployment dispatched for current main."
