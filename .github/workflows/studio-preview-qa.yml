name: Personal design lab QA
on:
  push:
    paths:
      - 'studio-preview/**'
      - 'tests/studio-preview.cjs'
      - '.github/workflows/studio-preview-qa.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/studio-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/studio-preview/ >/dev/null && break; sleep 1; done
          node tests/studio-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-qa
          path: studio-qa/
