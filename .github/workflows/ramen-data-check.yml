name: Ramen data release gate

on:
  pull_request:
    paths:
      - 'ramen/**'
      - 'vegan/ramen-data.js'
      - '.github/workflows/ramen-data-check.yml'
  push:
    branches: [main]
    paths:
      - 'ramen/**'
      - 'vegan/ramen-data.js'
      - '.github/workflows/ramen-data-check.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_FACT_CHECK_MODEL: gpt-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data, sources, buy links and images
        id: audit
        continue-on-error: true
        run: node ramen/scripts/validate-data.mjs
      - name: Upload deterministic audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ramen-validation-report
          path: ramen-validation-report.md
          if-no-files-found: error
          retention-days: 30
      - name: Resolve missing real packshots
        id: images
        continue-on-error: true
        run: node ramen/scripts/resolve-images.mjs
      - name: Upload packshot research report
        if: ${{ always() && steps.images.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ramen-packshot-resolution
          path: |
            ramen-image-resolution-report.json
            ramen-image-overrides.generated.js
          if-no-files-found: warn
          retention-days: 30
      - name: Independent source-grounded AI review
        if: ${{ steps.audit.outcome == 'success' && env.OPENAI_API_KEY != '' }}
        run: node ramen/scripts/agent-fact-check.mjs
      - name: Fail release when deterministic audit fails
        if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1
