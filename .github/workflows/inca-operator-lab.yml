name: INCA Operator Lab checks
on:
  push:
    paths:
      - "inca/**"
      - "inca-proof/**"
      - ".github/workflows/inca-operator-lab.yml"
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check operator replay and interactive document handoff
        run: node --test inca/operator-lab.test.cjs inca/interactive-case.test.cjs
      - name: Verify 72 synthetic claims and split discipline
        run: python -m unittest discover inca-proof/tests -v
