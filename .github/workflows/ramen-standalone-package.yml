name: Package standalone Ramen Passport

on:
  push:
    branches: [main]
    paths:
      - 'ramen/**'
      - '.github/workflows/ramen-standalone-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone repository
        run: node ramen/scripts/package-standalone.mjs
      - name: Validate standalone UI
        working-directory: dist/ramen-passport
        run: npm run check:ui
      - name: Validate standalone data and URLs
        working-directory: dist/ramen-passport
        run: npm run check:data
      - name: Upload standalone repository
        uses: actions/upload-artifact@v4
        with:
          name: ramen-passport-standalone-repo
          path: dist/ramen-passport
          if-no-files-found: error
          retention-days: 90
