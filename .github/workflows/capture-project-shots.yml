name: Refresh real portfolio screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-project-shots.yml
      - scripts/capture-project-shots.mjs
permissions:
  contents: write
concurrency:
  group: portfolio-real-screenshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture public product interfaces
        run: node scripts/capture-project-shots.mjs
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-shots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh captured project screenshots"
            git push
          fi
