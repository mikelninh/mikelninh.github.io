name: Publish Card House

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-card-house.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-card-house
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download verified exact build
        uses: actions/download-artifact@v4
        with:
          name: card-house-public-build
          path: /tmp/card-house-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30293709685

      - name: Verify release artifact
        run: |
          test -f /tmp/card-house-build/index.html
          grep -R -q "Full original game" /tmp/card-house-build
          grep -R -q "Prototype · house bot" /tmp/card-house-build
          if grep -R -q "Tiến Lên Sprint" /tmp/card-house-build; then
            echo "Refusing to publish the Sprint fallback."
            exit 1
          fi

      - name: Publish generated site
        run: |
          rm -rf tien-len
          mkdir -p tien-len
          cp -R /tmp/card-house-build/. tien-len/
          touch .nojekyll

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tien-len .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
          else
            git commit -m "Publish real three-game Card House"
            git push
          fi
