name: Sync Hyperspace Kids

on:
  push:
    paths:
      - '.github/workflows/sync-hyperspace-kids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v4

      - name: Fetch standalone web build
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/mikelninh/hyperspace-kids/main"
          mkdir -p /tmp/hyperspace-kids/styles /tmp/hyperspace-kids/src
          curl -fsSL "$base/index.html" -o /tmp/hyperspace-kids/index.html
          curl -fsSL "$base/styles/tokens.css" -o /tmp/hyperspace-kids/styles/tokens.css
          curl -fsSL "$base/styles/app.css" -o /tmp/hyperspace-kids/styles/app.css
          curl -fsSL "$base/styles/opening.css" -o /tmp/hyperspace-kids/styles/opening.css
          curl -fsSL "$base/src/app.js" -o /tmp/hyperspace-kids/src/app.js
          curl -fsSL "$base/src/audio.js" -o /tmp/hyperspace-kids/src/audio.js
          curl -fsSL "$base/src/collection.js" -o /tmp/hyperspace-kids/src/collection.js
          curl -fsSL "$base/src/state.js" -o /tmp/hyperspace-kids/src/state.js

      - name: Mirror web build
        run: |
          mkdir -p hyperspace-kids
          rm -rf hyperspace-kids/src hyperspace-kids/styles
          cp /tmp/hyperspace-kids/index.html hyperspace-kids/index.html
          cp -R /tmp/hyperspace-kids/src hyperspace-kids/src
          cp -R /tmp/hyperspace-kids/styles hyperspace-kids/styles

      - name: Commit mirror if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hyperspace-kids/index.html hyperspace-kids/src hyperspace-kids/styles
          if git diff --cached --quiet; then
            echo 'Mirror already current.'
          else
            git commit -m 'Sync Hyperspace Kids standalone build'
            git push
          fi
