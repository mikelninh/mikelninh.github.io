name: THE WAY local AI research
on:
  push:
    paths:
      - .github/workflows/the-way-local-ai.yml
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 1'
permissions:
  contents: read
concurrency:
  group: the-way-local-ai
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --quiet transformers==4.51.3 safetensors
      - name: Execute real bounded LLM mission
        run: python the-way/research-local.py "$RUNNER_TEMP/local-ai-report.json"
      - name: Preserve research candidates for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-way-local-ai-report
          path: ${{ runner.temp }}/local-ai-report.json
          retention-days: 30
