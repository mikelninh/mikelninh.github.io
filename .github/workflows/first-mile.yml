name: FIRST MILE evidence contracts
on:
  push:
    paths:
      - "first-mile/**"
      - "tests/first-mile.test.mjs"
      - ".github/workflows/first-mile.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/first-mile.test.mjs
