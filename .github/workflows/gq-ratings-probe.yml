name: GQ catalog source discovery probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'good-question/ratings/probe_rewe.py'
      - '.github/workflows/gq-ratings-probe.yml'
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: python good-question/ratings/probe_rewe.py
