name: Ramen data quality

on:
  push:
    paths:
      - 'vegan/ramen-data.js'
      - 'ramen/**'
      - '.github/workflows/ramen-data-quality.yml'
  pull_request:
    paths:
      - 'vegan/ramen-data.js'
      - 'ramen/**'
      - '.github/workflows/ramen-data-quality.yml'
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 50 layered product records and URLs
        run: node ramen/scripts/validate-data.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramen-validation-report
          path: ramen-validation-report.md
          if-no-files-found: warn
      - name: Optional AI contradiction review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FACT_CHECK_MODEL: ${{ vars.OPENAI_FACT_CHECK_MODEL || 'gpt-5' }}
        run: node ramen/scripts/agent-fact-check.mjs
      - name: Upload AI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramen-agent-review
          path: ramen-agent-review.json
          if-no-files-found: ignore
