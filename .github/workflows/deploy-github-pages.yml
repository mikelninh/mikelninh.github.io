name: Verify Card House on GitHub Pages

# Legacy release helper retained for manual Tiến Lên smoke checks.
# The canonical whole-site deployment is .github/workflows/pages.yml.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public Card House
        shell: bash
        run: |
          url='https://mikelninh.github.io/tien-len/'
          public_state='not-card-house'
          http_code='000'
          title=''

          for attempt in {1..24}; do
            http_code=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --output /tmp/pages-body.html \
              --write-out '%{http_code}' \
              "$url" || echo '000')
            title=$(grep -o -m1 -E '<title>[^<]+' /tmp/pages-body.html 2>/dev/null | sed 's/<title>//' || true)
            if grep -q 'THE CARD HOUSE' /tmp/pages-body.html 2>/dev/null; then
              public_state='card-house-live'
              break
            fi
            sleep 5
          done

          cat > pages-deploy-status.json <<EOF
          {
            "public_state": "$public_state",
            "http_code": "$http_code",
            "title": "$title",
            "url": "$url",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat pages-deploy-status.json

      - name: Commit verification status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deploy-status.json
          if git diff --cached --quiet; then
            echo "No verification status change."
          else
            git commit -m "Record GitHub Pages verification status"
            git push
          fi
