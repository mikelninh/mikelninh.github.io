name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "tien-len/**"
      - ".nojekyll"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Card House
        if: always()
        shell: bash
        run: |
          deploy_outcome='${{ steps.deployment.outcome }}'
          url='https://mikelninh.github.io/tien-len/'
          public_state='not-card-house'
          http_code='000'
          title=''

          for attempt in {1..24}; do
            http_code=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --output /tmp/pages-body.html \
              --write-out '%{http_code}' \
              "$url" || echo '000')
            title=$(grep -o -m1 -E '<title>[^<]+' /tmp/pages-body.html 2>/dev/null | sed 's/<title>//' || true)
            if grep -q 'THE CARD HOUSE' /tmp/pages-body.html 2>/dev/null; then
              public_state='card-house-live'
              break
            fi
            sleep 5
          done

          cat > pages-deploy-status.json <<EOF
          {
            "deploy_outcome": "$deploy_outcome",
            "public_state": "$public_state",
            "http_code": "$http_code",
            "title": "$title",
            "url": "$url",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat pages-deploy-status.json

      - name: Commit deployment status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-deploy-status.json
          if git diff --cached --quiet; then
            echo "No deployment status change."
          else
            git commit -m "Record GitHub Pages deployment status"
            git push
          fi
