name: THE WAY World data
on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 1 * *'
permissions:
  contents: read
concurrency:
  group: the-way-world-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 the-way/world-refresh.py "$RUNNER_TEMP/world-snapshot.json"
      - name: Publish only validated data
        run: |
          cp "$RUNNER_TEMP/world-snapshot.json" the-way/world-snapshot.json
          git config user.name "the-way-data[bot]"
          git config user.email "the-way-data@users.noreply.github.com"
          git add the-way/world-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh fixed-year world data"
          git push
