name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage pinned TrustReady Bao rehearsal
        env:
          TRUSTREADY_SHA: ed5115bd8da897900c0ca9cadf01ffd1f60d8026
        run: |
          set -euo pipefail
          mkdir -p trustready/pilot
          base="https://raw.githubusercontent.com/mikelninh/trustready/${TRUSTREADY_SHA}"
          curl --fail --silent --show-error --location "$base/bao-cockpit.html" --output trustready/pilot/index.html
          curl --fail --silent --show-error --location "$base/bao-cockpit.js" --output trustready/pilot/bao-cockpit.js
          curl --fail --silent --show-error --location "$base/golden-cases.js" --output trustready/pilot/golden-cases.js
          curl --fail --silent --show-error --location "$base/rehearsal-flow.js" --output trustready/pilot/rehearsal-flow.js
          grep -q "TrustReady schlägt vor" trustready/pilot/index.html
          grep -q "TR-GOLD-012" trustready/pilot/golden-cases.js
          grep -q "simulateGoldenCaseToDecision" trustready/pilot/rehearsal-flow.js

      - name: Build GitHub-native Mission Control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: mikelninh
          MISSION_CONTROL_REFRESH_URL: https://github.com/mikelninh/mikelninh.github.io/actions/workflows/pages.yml
        run: |
          set -euo pipefail
          rm -rf /tmp/council-mission-control
          git clone --depth 1 https://github.com/mikelninh/council.git /tmp/council-mission-control
          cd /tmp/council-mission-control
          npm run build:pages
          cd "$GITHUB_WORKSPACE"
          rm -rf mission-control
          cp -R /tmp/council-mission-control/dist-pages/mission-control ./mission-control
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('mission-control/mission-control.json','utf8'));if(d.schema!=='council-mission-control-v0.3'||!d.safety?.publicSafe||d.safety?.privateDetailsPublished!==false||d.projects.some(p=>p.private))process.exit(1);console.log('MISSION CONTROL DEPLOYMENT CONTRACT PASS:',d.projects.length,'public projects');"

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
