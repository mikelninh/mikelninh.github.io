name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Allow the running deployment to finish; frequent unrelated commits previously
  # cancelled every Pages run before publication could complete.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect original Beyond CV to the DKSR case
        run: python beyond-cv/link_portfolio.py

      - name: Stage pinned TrustReady Bao rehearsal
        env:
          TRUSTREADY_SHA: ed5115bd8da897900c0ca9cadf01ffd1f60d8026
        run: |
          set -euo pipefail
          mkdir -p trustready/pilot
          base="https://raw.githubusercontent.com/mikelninh/trustready/${TRUSTREADY_SHA}"
          curl --fail --silent --show-error --location "$base/bao-cockpit.html" --output trustready/pilot/index.html
          curl --fail --silent --show-error --location "$base/bao-cockpit.js" --output trustready/pilot/bao-cockpit.js
          curl --fail --silent --show-error --location "$base/golden-cases.js" --output trustready/pilot/golden-cases.js
          curl --fail --silent --show-error --location "$base/rehearsal-flow.js" --output trustready/pilot/rehearsal-flow.js
          grep -q "TrustReady schlägt vor" trustready/pilot/index.html
          grep -q "TR-GOLD-012" trustready/pilot/golden-cases.js
          grep -q "simulateGoldenCaseToDecision" trustready/pilot/rehearsal-flow.js

      - name: Build GitHub-native Mission Control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: mikelninh
          MISSION_CONTROL_REFRESH_URL: https://github.com/mikelninh/mikelninh.github.io/actions/workflows/pages.yml
        run: |
          set -euo pipefail
          rm -rf /tmp/council-mission-control
          git clone --depth 1 https://github.com/mikelninh/council.git /tmp/council-mission-control
          cd /tmp/council-mission-control
          npm run build:pages
          cd "$GITHUB_WORKSPACE"
          rm -rf mission-control
          cp -R /tmp/council-mission-control/dist-pages/mission-control ./mission-control
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('mission-control/mission-control.json','utf8'));if(d.schema!=='council-mission-control-v0.3'||!d.safety?.publicSafe||d.safety?.privateDetailsPublished!==false||d.projects.some(p=>p.private))process.exit(1);console.log('MISSION CONTROL DEPLOYMENT CONTRACT PASS:',d.projects.length,'public projects');"

      - name: Doctolib role demo QA
        run: |
          set -euo pipefail
          node doctolib-ai-ops/test.mjs
          node doctolib-onboarding/test.mjs

      - name: Generate recorded INCA Agent Ops 1.1 snapshot (offline, zero model costs)
        run: |
          set -euo pipefail
          python -m unittest discover inca-proof/agent-ops -p 'test_*.py' -v
          python inca-proof/agent-ops/agent_ops.py --planner offline --out inca/agent-ops-traces.json
          node --test inca/agent-ops-ui.test.cjs
          node --test inca/agent-ops-simple.test.cjs
          node --test inca/decision-lab.test.cjs
          node --test inca/jev-research.test.cjs
          node --test inca/field-notes.test.cjs
          node --test inca/first-30-days.test.cjs
      - name: Generate and validate ClaimsOps reliability report before publishing
        run: |
          set -euo pipefail
          python inca-proof/reliability-loop/reliability.py --out inca/reliability-loop-data.json
          python -m unittest discover inca-proof/reliability-loop -p 'test_*.py' -v
          node --test inca/reliability-loop.test.cjs
          node --test inca/live-model-eval.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke public portfolio, TrustReady and role demos
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          fetch_until_ready() {
            local url="$1"
            local marker="$2"
            local body
            body="$(mktemp)"
            for attempt in $(seq 1 36); do
              code="$(curl --location --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ] && grep -Fq -- "$marker" "$body"; then
                echo "LIVE PASS: $url"
                rm -f "$body"
                return 0
              fi
              echo "Waiting for Pages propagation ($attempt/36): $url returned $code"
              sleep 5
            done
            echo "LIVE FAIL: $url"
            head -80 "$body" || true
            rm -f "$body"
            return 1
          }

          fetch_until_ready "$base/" "I like to"
          fetch_until_ready "$base/beyond-cv/" 'id="state-bridge"'
          fetch_until_ready "$base/beyond-cv/dksr/" "Was braucht eine Stadt"
          fetch_until_ready "$base/beyond-cv/dksr/case.js" "var sources="
          fetch_until_ready "$base/beyond-cv/dksr/case.css" "--paper:#f6f2e9"
          fetch_until_ready "$base/trustready.html" "Know what your AI agent can actually do."
          fetch_until_ready "$base/broker-signup-lab/" "Wo verlieren wir Nutzer"
          fetch_until_ready "$base/doctolib-ai-ops/" "AI Operations Workbench"
          fetch_until_ready "$base/doctolib-onboarding/" "Onboarding Shift"
          fetch_until_ready "$base/first-mile/" "Better questions."
          fetch_until_ready "$base/first-mile/app.mjs" "async function parsePdf"
          fetch_until_ready "$base/first-mile/core.mjs" "export const analyze"
          fetch_until_ready "$base/inca/60s.html" 'id="case-workshop"'
          fetch_until_ready "$base/inca/60s.html" 'id="mistake-challenge"'
          fetch_until_ready "$base/inca/interactive-case.js" "IncaCaseWorkshop"
          fetch_until_ready "$base/inca/catch-the-mistake.js" "IncaMistakeChallenge"
          fetch_until_ready "$base/inca/agent-ops.html" "One claim."
          fetch_until_ready "$base/inca/first-30-days.html" "If I joined INCA"
          fetch_until_ready "$base/inca/jev-research.html" "Can a small AI find the mistakes that matter?"
          fetch_until_ready "$base/inca/field-notes.html" "What I built."
          fetch_until_ready "$base/inca/reliability-loop.html" 'id="gate-misses"'
          fetch_until_ready "$base/inca/reliability-loop.js" "IncaReliabilityLoop"
          fetch_until_ready "$base/inca/reliability-loop-data.json" "INCA-RELIABILITY-LOOP-V1"
          fetch_until_ready "$base/inca/jev-h1-h5.json" "INCA-JEV-H1-H5-PUBLIC"
          fetch_until_ready "$base/inca/jev-research-v2.json" "INCA-JEV-RESEARCH-V2-PUBLIC"
          fetch_until_ready "$base/inca/jev-h2-h6.json" "INCA-JEV-H2-H6-EXPLORATORY"
          fetch_until_ready "$base/inca/jev-h7.json" "INCA-JEV-H7-BILINGUAL-REAL-API"
          fetch_until_ready "$base/inca/decision-lab.html" "Which AI workflow actually helps?"
          fetch_until_ready "$base/inca/abc-proof.json" "INCA-ABC-PROOF-1"
          fetch_until_ready "$base/inca/agent-ops-simple.js" "IncaSimpleCase"
          fetch_until_ready "$base/inca/agent-ops-technical.html" "Seven visible steps"
          fetch_until_ready "$base/inca/agent-ops-ui.js" "IncaAgentOpsUI"
          fetch_until_ready "$base/inca/agent-ops-traces.json" "agent-ops-v1.1"
          fetch_until_ready "$base/inca/operator-shift.html" 'id="shift-app"'
          fetch_until_ready "$base/inca/operator-shift.js" "IncaOperatorShift"
          fetch_until_ready "$base/inca/operator-shift.html" 'id="ai-evidence"'
          fetch_until_ready "$base/inca/ai-proof.js" "IncaAiEvidence"
