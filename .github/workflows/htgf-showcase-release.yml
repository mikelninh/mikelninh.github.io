name: HTGF showcase · release-level browser verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'agents/index.html'
      - 'gitlaw/index.html'
      - 'gitlaw-proof/index.html'
      - 'pruefpilot/index.html'
      - 'assets/application-showcase-v2.css'
      - 'tests/htgf-showcase-e2e.py'
      - '.github/workflows/htgf-showcase-release.yml'
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium for real browser interactions
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install chromium
      - name: Exercise real interactions and mobile layouts
        run: python tests/htgf-showcase-e2e.py
      - name: Preserve screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: htgf-release-visual-proof
          path: artifacts/htgf-proof-release/
          if-no-files-found: warn
