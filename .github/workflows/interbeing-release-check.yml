name: Interbeing public release checks
on:
  push:
    branches: [main]
    paths:
      - 'interbeing/**'
      - '.github/workflows/interbeing-release-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interbeing-release-check
  cancel-in-progress: true
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runner
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify Root Atlas publication and real-origin interactions
        env:
          SITE: https://mikelninh.github.io/interbeing/
        run: python interbeing/qa/test_v2_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interbeing-v2-public-qa
          path: interbeing-qa
          if-no-files-found: ignore
