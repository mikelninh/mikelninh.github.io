name: INCA proof checks

on:
  push:
    paths:
      - 'inca/**'
      - 'inca-proof/**'
      - '.github/workflows/inca-proof.yml'
  pull_request:
    paths:
      - 'inca/**'
      - 'inca-proof/**'
      - '.github/workflows/inca-proof.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild deterministic evaluation
        run: python inca-proof/src/claims_eval.py
      - name: Run proof tests
        run: python -m unittest discover inca-proof/tests -v
      - name: Run model-lab offline regression tests (free)
        run: python -m unittest discover inca-proof/model-eval -p 'test_*.py' -v
      - name: Run INCA Release 1.0 cross-claim regressions (free)
        run: node --test inca/release-engine.test.cjs
      - name: Test Agent Ops restricted tool runner (offline and free)
        run: python -m unittest discover inca-proof/agent-ops -p 'test_*.py' -v
      - name: Produce auditable Agent Ops trace and validate dashboard contract (offline and free)
        run: |
          python inca-proof/agent-ops/agent_ops.py --planner offline --out inca/agent-ops-traces.json
          node --test inca/agent-ops-ui.test.cjs
          node --test inca/agent-ops-simple.test.cjs
          node --test inca/decision-lab.test.cjs
          node --test inca/jev-research.test.cjs
          node --test inca/field-notes.test.cjs
          node --test inca/first-30-days.test.cjs
      - name: Ensure checked-in report is clean
        run: git diff --exit-code -- inca-proof/reports/deterministic_eval.json
