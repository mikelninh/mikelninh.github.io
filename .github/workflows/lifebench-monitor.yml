name: LifeBench official law monitor
on:
  push:
    paths:
      - '.github/workflows/lifebench-monitor.yml'
      - 'firstlight-lab/scripts/monitor.py'
      - 'firstlight-lab/tests/**'
  workflow_dispatch:
  schedule:
    - cron: '13 6,18 * * *'
permissions:
  contents: write
  issues: read
concurrency:
  group: lifebench-official-monitor
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify monitor safety tests
        run: python -m unittest discover firstlight-lab/tests -p 'test_monitor.py' -v
      - name: Update official source snapshot
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python firstlight-lab/scripts/monitor.py --out firstlight-lab/data/law-feed.json
      - name: Check output contract
        run: |
          python - <<'PY'
          import json
          p='firstlight-lab/data/law-feed.json'
          x=json.load(open(p))
          assert x['schema']=='lifebench-official-monitor-v1'
          assert x['sources']['dip']['status']=='ok'
          assert x['sources']['gazette']['status'] in ('ok', 'unavailable')
          assert x['cases'][0]['id']=='334563'
          if x['sources']['gazette']['status']!='ok': print('DEGRADED: BGBl source unavailable; no new promulgation claim permitted')
          assert all(not c['entry_into_force']['verified'] and not c['impact']['verified'] for c in x['cases'])
          print('Contract PASS:',len(x['cases']),'records')
          PY
      - name: Commit evidence snapshot only when changed
        run: |
          git config user.name 'lifebench-monitor[bot]'
          git config user.email 'lifebench-monitor[bot]@users.noreply.github.com'
          git add firstlight-lab/data/law-feed.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'data(lifebench): refresh official sources [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt*3))
            done
            exit 1
          fi
