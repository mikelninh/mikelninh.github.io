name: Guided OpenAction demo QA

on:
  push:
    branches: [main]
    paths:
      - 'openaction/workspace/**'
      - '.github/workflows/openaction-guided-qa.yml'
  pull_request:
    paths:
      - 'openaction/workspace/**'
      - '.github/workflows/openaction-guided-qa.yml'
  workflow_dispatch:

jobs:
  guided-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Exercise role-based next-action walkthrough
        run: |
          mkdir -p artifacts/openaction-guide
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              time.sleep(.6)
              with sync_playwright() as p:
                  b=p.chromium.launch(headless=True)
                  page=b.new_page(viewport={'width':1280,'height':900})
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('http://127.0.0.1:8765/openaction/workspace/?case=careos&role=clinical',wait_until='networkidle')
                  assert page.locator('#oaGuideHeading').inner_text()=='Viele Beteiligte. Eine gemeinsame Richtung.'
                  assert page.locator('#caseTitle').inner_text()=='CareOS Pilot im Krankenhaus'
                  assert page.locator('#taskTitle').inner_text().strip()
                  assert page.locator('#guideRole option').count() >= 8
                  assert page.locator('#guideNext').inner_text().strip()
                  assert page.locator('#oaDetailsFold').get_attribute('open') is None
                  page.locator('#guideRole').select_option('clinicalSafety')
                  assert page.locator('#roleSelect').input_value()=='clinicalSafety'
                  page.locator('#guideAction').click()
                  assert page.locator('#action').is_visible()
                  page.locator('#proofMode').click()
                  assert page.locator('#proofMode').get_attribute('class')=='active'
                  page.locator('#simpleMode').click()
                  page.locator('#guideReset').click()
                  assert page.locator('#caseTitle').inner_text()=='CareOS Pilot im Krankenhaus'
                  page.screenshot(path='artifacts/openaction-guide/desktop.png',full_page=True)
                  mobile=b.new_page(viewport={'width':390,'height':844})
                  mobile.goto('http://127.0.0.1:8765/openaction/workspace/?case=careos&role=clinical',wait_until='networkidle')
                  assert mobile.locator('#guideRole').is_visible()
                  assert mobile.locator('#guideAction').is_visible()
                  assert mobile.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                  mobile.screenshot(path='artifacts/openaction-guide/mobile.png',full_page=True)
                  assert not errors, errors
                  b.close()
          finally:
              server.terminate();server.wait(timeout=5)
          print('Guided OpenAction QA: OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-openaction-visual
          path: artifacts/openaction-guide/
          if-no-files-found: warn
