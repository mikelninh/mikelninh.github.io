name: External public link check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints without authentication
        shell: bash
        run: |
          set -u
          for url in \
            'https://mikelninh-github-io.vercel.app/tien-len/' \
            'https://mikelninh.github.io/tien-len/'
          do
            rm -f /tmp/body.html
            result=$(curl --location --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --output /tmp/body.html \
              --write-out 'status=%{http_code} final=%{url_effective} type=%{content_type}' \
              "$url" 2>&1)
            marker='none'
            if grep -q 'THE CARD HOUSE' /tmp/body.html 2>/dev/null; then marker='card-house'; fi
            if grep -qi 'Authentication Required' /tmp/body.html 2>/dev/null; then marker='auth-required'; fi
            if grep -q '404: This page could not be found' /tmp/body.html 2>/dev/null; then marker='404-page'; fi
            echo "$url | $result | marker=$marker"
          done
