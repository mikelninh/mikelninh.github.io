name: Beyond CV bridge QA

on:
  pull_request:
    paths:
      - 'beyond-cv/**'
      - '.github/workflows/beyond-cv-bridge-qa.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beyond-cv-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify preserved original, new case and gift flow
        run: python beyond-cv/dksr/check.py
      - name: Preserve real review evidence and built files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-cv-bridge-proof
          path: beyond-cv-proof
          retention-days: 14
