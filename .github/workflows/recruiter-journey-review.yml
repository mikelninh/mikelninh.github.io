name: Recruiter journey review
on:
  push:
    branches: [release/recruiter-journey-20261007]
    paths:
      - '.github/workflows/recruiter-journey-review.yml'
      - 'beyond-cv/**'
      - 'selected-work/**'
      - 'pruefpilot/**'
      - 'careos/sjk/**'
      - 'review/recruiter/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recruiter-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  accept:
    if: github.ref == 'refs/heads/release/recruiter-journey-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/recruiter-journey-20261007
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /PORTFOLIO_STANDARD.md
            /POSITIONING.md
            /MASTER_CV.md
            /index.html
            /cv.html
            /cv-de.html
            /assets/
            /beyond-cv/
            /selected-work/
            /pruefpilot/
            /careos/sjk/
            /review/recruiter/
            /hyperspace-kids/assets/v036/rift-seed-art-v3.webp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and accessibility tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/recruiter-axe --ignore-scripts axe-core@4.10.3
      - name: Apply only guarded candidate changes
        run: |
          python review/recruiter/prepare.py
          python review/recruiter/polish.py
      - name: Existing source-dependency and personal reflection acceptance
        env:
          AXE_PATH: /tmp/recruiter-axe/node_modules/axe-core/axe.min.js
        run: python beyond-cv/atelier/verify.py
      - name: Recruiter navigation, first-screen action, review race and handover
        env:
          AXE_PATH: /tmp/recruiter-axe/node_modules/axe-core/axe.min.js
        run: python review/recruiter/verify.py
      - name: Actual GitLaw prepared example and induced source fallback
        run: python review/recruiter/gitlaw_acceptance.py
      - name: Persist candidate only after all gates pass (review branch, never main)
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/recruiter-journey-20261007'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- selected-work/index.html review/recruiter/verify.py beyond-cv/atelier/index.html beyond-cv/atelier/personal.js beyond-cv/atelier/verify.py beyond-cv/link_portfolio.py pruefpilot/index.html careos/sjk/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: apply browser-verified recruiter journey candidate'
            git push origin HEAD:refs/heads/release/recruiter-journey-20261007
          fi
          git rev-parse HEAD > recruiter-review/verified-branch-commit.txt
      - name: Preserve exact candidate source and browser evidence
        if: always()
        run: |
          mkdir -p recruiter-review/source
          python - <<'PY'
          from pathlib import Path
          import shutil
          paths=['selected-work/index.html','pruefpilot/index.html','careos/sjk/index.html','beyond-cv/atelier/index.html','beyond-cv/atelier/atelier.css','beyond-cv/atelier/personal.js','beyond-cv/atelier/verify.py','beyond-cv/link_portfolio.py','review/recruiter/prepare.py','review/recruiter/polish.py','review/recruiter/verify.py','review/recruiter/gitlaw_acceptance.py']
          for f in paths:
            source=Path(f)
            if source.is_file():
              dest=Path('recruiter-review/source')/f;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,dest)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recruiter-journey-candidate
          path: |
            recruiter-review
            atelier-proof
          retention-days: 7
