name: BRIDGE · honest-matching release gate
on:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax-check public BRIDGE interface
        run: node --check bridge/app.js
      - name: Run public-resource matching and abstention gates
        run: node --test bridge/tests/bridge-gate.test.cjs
