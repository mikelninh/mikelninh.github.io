name: RETURN LOOP v14 - quality gate
on:
  push:
    paths:
      - 'application-demos/v14-source/**'
      - '.github/workflows/return-loop-v14-ci.yml'
  pull_request:
    paths:
      - 'application-demos/v14-source/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source JS syntax
        run: |
          node --check application-demos/v14-source/public/app.js
          node --check application-demos/v14-source/lib/providers.js
          node --check application-demos/v14-source/api/infer.js
      - name: Run deterministic and mocked inference tests (no paid API calls)
        working-directory: application-demos/v14-source
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: Run actual browser workflow smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node application-demos/v14-source/scripts/pilot-browser-smoke.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-loop-pilot-browser
          path: application-demos/v14-source/artifacts/
          if-no-files-found: ignore

  ecosystem-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Live read-only customer entry point checks
        run: node scripts/product-live-readiness.mjs
      - name: Check out canonical Factory / HausPilot / LaunchCheck source
        uses: actions/checkout@v4
        with:
          repository: mikelninh/digital-worker-factory
          path: external/digital-worker-factory
      - name: Verify Factory policy and evaluation invariants
        working-directory: external/digital-worker-factory
        run: |
          node scripts/harness-check.mjs
          node evals/run.mjs
          node --test core/agent-gateway.test.mjs core/factory-gateway.test.mjs
      - name: Verify HausPilot V1 shadow workflow and privacy boundary
        working-directory: external/digital-worker-factory
        run: |
          node packs/hauspilot/runtime/eval.mjs
          node --test packs/hauspilot/runtime/runtime.test.mjs packs/hauspilot/privacy/privacy.test.mjs
          node packs/hauspilot/first-customer/generate-demo.mjs /tmp/hauspilot-release-audit
          node packs/hauspilot/runtime/preflight.mjs /tmp/hauspilot-release-audit
      - name: Verify LaunchCheck deterministic security and routing
        working-directory: external/digital-worker-factory
        run: |
          node --test products/launchcheck/tests/launchcheck.test.mjs products/launchcheck/tests/submission-metadata.test.mjs products/launchcheck/tests/routing-benchmark.test.mjs
          node products/launchcheck/routing/routing-score.mjs --validate-only
      - name: Probe real LaunchCheck MCP initialize, tool listing and audit
        env:
          MCP_URL: https://launchcheck-ai.netlify.app/mcp
        run: |
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method initialize --format json > /tmp/launchcheck-initialize.json
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/list --strict --format json > /tmp/launchcheck-tools.json
          grep -q 'audit_website' /tmp/launchcheck-tools.json
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/call --tool-name audit_website --tool-args-json '{"url":"https://example.com","max_links":2}' --format json > /tmp/launchcheck-audit.json
          grep -q 'launchcheck/audit-v0.1' /tmp/launchcheck-audit.json
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/call --tool-name audit_website --tool-args-json '{"url":"http://127.0.0.1","max_links":0}' --format json > /tmp/launchcheck-private.json
          grep -Eq 'Private|private|reserved|local' /tmp/launchcheck-private.json
