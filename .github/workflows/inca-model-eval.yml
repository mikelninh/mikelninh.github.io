name: INCA Synthetic Model Eval

on:
  push:
    paths:
      - 'inca-proof/model-eval/START_LIVE_RUN_ONCE.md'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Dry run costs nothing; live calls the OpenAI API"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - live
      models:
        description: "Comma-separated OpenAI model IDs"
        required: true
        type: string
        default: "gpt-4o-mini,gpt-6-luna,gpt-6.1-sol"
      cases_per_model:
        description: "Cases per model; charged mode capped at 5"
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: write

concurrency:
  group: inca-model-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Validate and optionally benchmark synthetic document cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_IDS: ${{ github.event_name == 'push' && 'gpt-4o-mini,gpt-6-luna,gpt-6.1-sol' || inputs.models }}
      CASE_LIMIT: ${{ github.event_name == 'push' && '5' || inputs.cases_per_model }}
      RUN_MODE: ${{ github.event_name == 'push' && 'live' || inputs.run_mode }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset and pipeline (zero API calls)
        run: python -m unittest discover inca-proof/model-eval -p "test_*.py" -v
      - name: Confirm bounded execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          models = [m.strip() for m in os.environ['MODEL_IDS'].split(',') if m.strip()]
          limit = int(os.environ['CASE_LIMIT'])
          assert 1 <= len(models) <= 3, 'Only 1-3 models per run'
          assert all(re.fullmatch(r'[a-zA-Z0-9._-]+', m) for m in models), 'Invalid model IDs'
          assert 1 <= limit <= 5, 'At most 5 cases per model'
          assert os.environ['RUN_MODE'] in ('live', 'dry-run')
          if os.environ['RUN_MODE'] == 'live':
              assert os.environ.get('OPENAI_API_KEY'), 'Add repository secret OPENAI_API_KEY before selecting live'
          print('Maximum billable API calls if live:', limit * len(models))
          PY
      - name: Dry run (no API calls)
        if: ${{ inputs.run_mode == 'dry-run' }}
        run: |
          python inca-proof/model-eval/run_openai.py --dry-run \
            --models "$MODEL_IDS" --split holdout --limit "$CASE_LIMIT"
      - name: Live OpenAI model comparison (billable)
        if: ${{ github.event_name != 'push' && inputs.run_mode == 'live' }}
        run: |
          python inca-proof/model-eval/run_openai.py \
            --models "$MODEL_IDS" --split holdout --limit "$CASE_LIMIT" \
            --out "inca-proof/model-eval/reports/github_run_${GITHUB_RUN_ID}.json"
      - name: Record eight evidence-grounded synthetic extractions (billable)
        if: ${{ github.event_name == 'push' }}
        run: |
          python -m unittest discover inca-proof/model-eval -p 'test_shift_snapshot.py' -v
          python inca-proof/model-eval/run_shift_snapshot.py --live --model gpt-6-luna --out inca/ai-evidence.json
      - name: Publish recorded synthetic extraction evidence
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inca/ai-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Add measured fictional OpenAI extraction snapshot [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Attach report (synthetic aggregate results only)
        if: ${{ (github.event_name == 'push' || inputs.run_mode == 'live') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inca-model-eval-${{ github.run_id }}
          path: inca-proof/model-eval/reports/github_run_*.json
          if-no-files-found: warn
          retention-days: 14
