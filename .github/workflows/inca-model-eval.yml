name: INCA Synthetic Model Eval

on:
  push:
    paths:
      - 'inca-proof/model-eval/START_LIVE_RUN_ONCE.md'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "dry-run free; paired-dry-run free; paired-live uses Jev + GPT on identical fictional cases"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - live
          - snapshot
          - jev
          - paired-dry-run
          - paired-live
      paired_split:
        description: "Paired Jev/GPT benchmark split"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - holdout
      paired_cases:
        description: "Paired cases: up to 2 billed requests per case; first choose 5"
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "5"
          - "10"
          - "20"
      jev_cases:
        description: "Official TypeSafe Jev shadow judgments: 1 (first test), 3, or 8. Only used when run_mode=jev."
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "3"
          - "8"
      models:
        description: "Comma-separated OpenAI model IDs"
        required: true
        type: string
        default: "gpt-4o-mini,gpt-6-luna,gpt-6.1-sol"
      cases_per_model:
        description: "Cases per model; charged mode capped at 5"
        required: true
        type: choice
        default: "5"
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: write

concurrency:
  group: inca-model-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Validate and optionally benchmark synthetic document cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_IDS: ${{ github.event_name == 'push' && 'gpt-4o-mini,gpt-6-luna,gpt-6.1-sol' || inputs.models }}
      CASE_LIMIT: ${{ github.event_name == 'push' && '5' || inputs.cases_per_model }}
      RUN_MODE: ${{ github.event_name == 'push' && 'live' || inputs.run_mode }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      JEV_CASE_LIMIT: ${{ inputs.jev_cases }}
      PAIRED_CASE_LIMIT: ${{ inputs.paired_cases }}
      PAIRED_SPLIT: ${{ inputs.paired_split }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset and pipeline (zero API calls)
        run: python -m unittest discover inca-proof/model-eval -p "test_*.py" -v
      - name: Confirm bounded execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          models = [m.strip() for m in os.environ['MODEL_IDS'].split(',') if m.strip()]
          limit = int(os.environ['CASE_LIMIT'])
          assert 1 <= len(models) <= 3, 'Only 1-3 models per run'
          assert all(re.fullmatch(r'[a-zA-Z0-9._-]+', m) for m in models), 'Invalid model IDs'
          assert 1 <= limit <= 5, 'At most 5 cases per model'
          assert os.environ['RUN_MODE'] in ('live', 'dry-run', 'snapshot', 'jev', 'paired-dry-run', 'paired-live')
          if os.environ['RUN_MODE'] in ('live','snapshot'):
              assert os.environ.get('OPENAI_API_KEY'), 'Add repository secret OPENAI_API_KEY before selecting live or snapshot'
          if os.environ['RUN_MODE'] == 'jev':
              assert os.environ.get('TYPESAFE_API_KEY'), 'Add repository secret TYPESAFE_API_KEY before selecting jev'
              assert os.environ.get('JEV_CASE_LIMIT') in ('1', '3', '8'), 'Only 1, 3 or 8 Jev cases allowed'
          if os.environ['RUN_MODE'] == 'paired-live':
              assert os.environ.get('TYPESAFE_API_KEY') and os.environ.get('OPENAI_API_KEY'), 'Both model secrets required; no model calls made.'
              assert os.environ.get('PAIRED_CASE_LIMIT') in ('1','5','10','20')
              assert os.environ.get('PAIRED_SPLIT') in ('dev','holdout')
          print('Explicit run mode:',os.environ['RUN_MODE'])
          PY
      - name: Dry run (no API calls)
        if: ${{ inputs.run_mode == 'dry-run' }}
        run: |
          python inca-proof/model-eval/run_openai.py --dry-run \
            --models "$MODEL_IDS" --split holdout --limit "$CASE_LIMIT"
      - name: Live OpenAI model comparison (billable)
        if: ${{ github.event_name != 'push' && inputs.run_mode == 'live' }}
        run: |
          python inca-proof/model-eval/run_openai.py \
            --models "$MODEL_IDS" --split holdout --limit "$CASE_LIMIT" \
            --out "inca-proof/model-eval/reports/github_run_${GITHUB_RUN_ID}.json"
      - name: Paired benchmark dry run (zero calls)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'paired-dry-run' }}
        run: |
          python inca-proof/model-eval/paired_benchmark.py --mode dry-run \
            --split "$PAIRED_SPLIT" --limit "$PAIRED_CASE_LIMIT"
      - name: Paired Jev + GPT benchmark (explicitly billable)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'paired-live' }}
        run: |
          python inca-proof/model-eval/paired_benchmark.py --mode live \
            --split "$PAIRED_SPLIT" --limit "$PAIRED_CASE_LIMIT" --model gpt-4o-mini \
            --out "inca-proof/model-eval/reports/paired_${GITHUB_RUN_ID}.json"
      - name: Attach paired report (no auto-publication)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'paired-live' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inca-paired-${{ github.run_id }}
          path: inca-proof/model-eval/reports/paired_*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Official TypeSafe Jev shadow run (billable, at most eight fictional cases)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'jev' }}
        run: |
          python inca-proof/model-eval/cost_quality.py --mode jev \
            --limit "$JEV_CASE_LIMIT" --threshold 0.5 \
            --out "inca-proof/model-eval/reports/jev_run_${GITHUB_RUN_ID}.json"
      - name: Attach TypeSafe Jev shadow report (not auto-published)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'jev' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inca-typesafe-jev-${{ github.run_id }}
          path: inca-proof/model-eval/reports/jev_run_*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record eight evidence-grounded synthetic extractions (billable)
        if: ${{ github.event_name == 'push' || inputs.run_mode == 'snapshot' }}
        run: |
          python -m unittest discover inca-proof/model-eval -p 'test_shift_snapshot.py' -v
          python inca-proof/model-eval/run_shift_snapshot.py --live --model gpt-6-luna --out inca/ai-evidence.json
      - name: Publish recorded synthetic extraction evidence
        if: ${{ github.event_name == 'push' || inputs.run_mode == 'snapshot' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inca/ai-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish measured fictional OpenAI extraction snapshot"
            # The portfolio repository receives frequent concurrent commits.
            # Only append the synthetic snapshot; never force push.
            published=false
            for attempt in $(seq 1 30); do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                published=true
                echo "Synthetic extraction snapshot published on attempt $attempt"
                break
              fi
              echo "Concurrent push detected; retrying ($attempt/30)"
              sleep 2
            done
            if [ "$published" != "true" ]; then
              echo "::error::Could not publish synthetic extraction after 30 safe attempts"
              exit 1
            fi
          fi
      - name: Attach synthetic recorded OpenAI extraction snapshot
        if: ${{ (github.event_name == 'push' || inputs.run_mode == 'snapshot') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inca-shift-snapshot-${{ github.run_id }}
          path: inca/ai-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Attach report (synthetic aggregate results only)
        if: ${{ (github.event_name == 'push' || inputs.run_mode == 'live') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inca-model-eval-${{ github.run_id }}
          path: inca-proof/model-eval/reports/github_run_*.json
          if-no-files-found: warn
          retention-days: 14
