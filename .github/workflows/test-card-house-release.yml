name: Test Card House release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download verified source bundle
        env:
          SOURCE_BUNDLE_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-1eb0-8246-9ac5-cf405116e5b6/raw?se=2026-07-27T18:29:00Z&sp=r&sv=2026-02-06&sr=b&scid=528425ce-987f-5075-83d4-d51528785878&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T03:35:51Z&ske=2026-07-29T03:35:51Z&sks=b&skv=2026-02-06&sig=K8j13nY7%2B%2B%2B2vvgplFTRXQShHljE1baAxpIGdG/6240%3D"
        run: |
          mkdir -p /tmp/card-house-download /tmp/card-house-source
          curl --fail --location --show-error "$SOURCE_BUNDLE_URL" --output /tmp/card-house-download/artifact.zip
          file /tmp/card-house-download/artifact.zip
          unzip -l /tmp/card-house-download/artifact.zip
          unzip -q /tmp/card-house-download/artifact.zip -d /tmp/card-house-download
          unzip -q /tmp/card-house-download/tien-len-source.zip -d /tmp/card-house-source
          test -f /tmp/card-house-source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: /tmp/card-house-source/package-lock.json

      - name: Verify and build exact app
        working-directory: /tmp/card-house-source
        env:
          GITHUB_PAGES: "true"
        run: |
          npm install --legacy-peer-deps --silent
          npm run lint
          npm run test:card-house
          npm run test:engine
          npm run build
          test -f out/index.html

      - name: Upload exact public build
        uses: actions/upload-artifact@v4
        with:
          name: card-house-public-build
          path: /tmp/card-house-source/out
          if-no-files-found: error
          retention-days: 1
