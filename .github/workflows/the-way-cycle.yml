name: THE WAY five-role research cycle
on:
  push:
    paths:
      - .github/workflows/the-way-cycle.yml
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * 1'
permissions:
  contents: read
concurrency:
  group: the-way-research-cycle
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install --quiet transformers==4.51.3 safetensors sentencepiece protobuf
      - name: Execute evidence-to-evaluation mission
        run: python the-way/research-cycle.py "$RUNNER_TEMP/research-cycle-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-way-research-cycle
          path: ${{ runner.temp }}/research-cycle-report.json
          retention-days: 30
