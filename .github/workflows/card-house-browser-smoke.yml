name: Card House browser smoke

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact released build
        uses: actions/download-artifact@v4
        with:
          name: card-house-public-build
          path: /tmp/site/tien-len
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30293709685

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser driver
        run: npm install --no-save playwright-core@1.54.1

      - name: Run released-build interaction test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/site >/tmp/card-house-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for _ in {1..20}; do
            curl -fsS http://127.0.0.1:4173/tien-len/ >/dev/null && break
            sleep 0.5
          done

          set +e
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node qa/card-house-smoke.cjs 2>&1 | tee /tmp/card-house-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit "$STATUS"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-house-browser-evidence
          path: |
            /tmp/card-house-smoke.png
            /tmp/card-house-smoke.log
            /tmp/card-house-http.log
          if-no-files-found: ignore
          retention-days: 1
