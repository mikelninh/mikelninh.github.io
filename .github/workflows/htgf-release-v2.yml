name: HTGF Release v2 · visual proof contracts
on:
  push:
    paths:
      - 'agents/index.html'
      - 'gitlaw/index.html'
      - 'pruefpilot/index.html'
      - 'assets/application-showcase-v2.css'
      - 'tests/htgf-release-v2.test.cjs'
      - '.github/workflows/htgf-release-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/htgf-release-v2.test.cjs
