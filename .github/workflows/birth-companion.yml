name: Birth Companion proof
on:
  workflow_dispatch:
  push:
    paths:
      - 'product-architect/os/missions/digitize-germany/birth-companion/**'
      - '.github/workflows/birth-companion.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Birth Companion scenario tests
        working-directory: product-architect/os/missions/digitize-germany/birth-companion
        run: node tests.mjs
