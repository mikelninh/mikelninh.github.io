name: GOOD QUESTION V2 / editorial release candidate QA
on:
  push:
    branches: [main]
    paths:
      - 'good-question/slow/design-lab/v2/**'
      - '.github/workflows/gq-v2-rc-qa.yml'
  pull_request:
    paths:
      - 'good-question/slow/design-lab/v2/**'
      - '.github/workflows/gq-v2-rc-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: good-question-v2-rc-qa
  cancel-in-progress: true
jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and accessibility tooling
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 8099 >/tmp/gq-v2-http.log 2>&1 &
          sleep 2
      - name: Run page, content, interaction, accessibility and mobile tests
        run: node good-question/slow/design-lab/v2/qa.mjs
      - name: Save visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-question-v2-review-screenshots
          path: good-question/slow/design-lab/v2/qa-shots/
          if-no-files-found: ignore
