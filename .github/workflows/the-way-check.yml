name: THE WAY atlas quality checks

on:
  push:
    branches: [main]
    paths:
      - 'the-way/**'
      - '.github/workflows/the-way-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout registry and app
        uses: actions/checkout@v4
      - name: Verify sourced records, coordinate bounds, classification, and frontend code
        run: node the-way/checks.mjs
      - name: Desktop and mobile browser QA
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wayqa
          cp the-way/e2e.mjs /tmp/wayqa/e2e.mjs
          cd /tmp/wayqa
          npm init -y >/dev/null
          npm install --no-save --silent playwright-core@1.56.1
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/the-way" >/tmp/way-http.log 2>&1 &
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then echo "No Chromium executable on runner"; exit 1; fi
          WAY_URL=http://127.0.0.1:8765/ WAY_SHOTS="$GITHUB_WORKSPACE/the-way/screenshots" CHROME_PATH="$CHROME_PATH" node e2e.mjs
      - name: Save browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-way-visual-qa
          path: the-way/screenshots/
          retention-days: 2
          if-no-files-found: ignore
      - name: Inspect news endpoint (availability may depend on third-party feeds)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://htffcvdopavknnylbowl.supabase.co/functions/v1/the-way-news'
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  d=json.load(r)
              print('Source check:',d.get('checkedAt'),'Status:',d.get('status'),'Headlines:',len(d.get('items',[])))
              assert d.get('sourceType')=='public news RSS, NOT geolocated incidents'
          except Exception as e:
              print('News feed unavailable; static atlas still works:',str(e))
          PY
