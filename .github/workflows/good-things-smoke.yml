name: GOOD THINGS core and protein QA
on:
  push:
    paths:
      - 'good-things/**'
      - '.github/workflows/good-things-smoke.yml'
  pull_request:
    paths:
      - 'good-things/**'
      - '.github/workflows/good-things-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline smoke tests
        run: node --test good-things/tests/smoke.mjs good-things/tests/protein-target.test.mjs
