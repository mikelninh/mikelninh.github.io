name: Beyond Atelier QA

on:
  pull_request:
    paths:
      - 'beyond-cv/atelier/**'
      - 'beyond-cv/dksr/atelier/**'
      - '.github/workflows/beyond-atelier-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beyond-atelier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and accessibility runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/atelier-a11y --ignore-scripts axe-core@4.10.3
      - name: Dependencies, browser, original artwork and user-controlled draft
        env:
          AXE_PATH: /tmp/atelier-a11y/node_modules/axe-core/axe.min.js
        run: python beyond-cv/atelier/verify.py
      - name: Keep actual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyond-atelier-proof
          path: atelier-proof
          retention-days: 14
