name: TrustReady pilot page QA

on:
  pull_request:
    paths:
      - 'trustready-security-pilot.html'
      - '.github/workflows/trustready-pilot-qa.yml'
  push:
    branches: [main]
    paths:
      - 'trustready-security-pilot.html'
      - '.github/workflows/trustready-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Test offer comprehension and responsive interaction
        run: |
          mkdir -p artifacts/trustready-pilot
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright

          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              time.sleep(.5)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  base='http://127.0.0.1:8765/trustready-security-pilot.html'
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto(base,wait_until='networkidle')
                  assert page.locator('h1').inner_text()=="Can your AI agent reach an effect it shouldn’t?"
                  body=page.locator('body').inner_text()
                  for token in ['€1,500 founding price','7 days','14 → 0','6/6','7/7','Scope one workflow']:
                      assert token in body, token
                  assert page.locator('a[href^="mailto:"]').count() >= 3
                  assert 'penetration test' in body.lower()
                  assert 'certification' in body.lower()

                  # One interaction must change the concrete effect definition.
                  page.locator('[data-effect="api"]').click()
                  assert 'Unapproved egress' in page.locator('#resultTitle').inner_text()
                  assert 'network/API call' in page.locator('#sinkText').inner_text()
                  page.locator('[data-effect="code"]').click()
                  assert 'Unauthorized execution' in page.locator('#resultTitle').inner_text()
                  assert 'process/subprocess' in page.locator('#sinkText').inner_text()
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                  page.screenshot(path='artifacts/trustready-pilot/desktop.png',full_page=True)

                  mobile=browser.new_page(viewport={'width':390,'height':844})
                  mobile.goto(base,wait_until='networkidle')
                  assert mobile.locator('h1').is_visible()
                  mobile.locator('[data-effect="message"]').click()
                  assert 'Unauthorized outbound action' in mobile.locator('#resultTitle').inner_text()
                  assert mobile.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                  mobile.screenshot(path='artifacts/trustready-pilot/mobile.png',full_page=True)
                  assert not errors, errors
                  browser.close()
          finally:
              server.terminate(); server.wait(timeout=5)
          print('TrustReady founding pilot browser QA: PASS')
          PY
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trustready-pilot-visual-qa
          path: artifacts/trustready-pilot/
          if-no-files-found: error
