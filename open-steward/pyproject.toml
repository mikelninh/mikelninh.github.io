[project]
name = "open-steward"
version = "0.1.0"
description = "Open-source operating system for founder-led, agent-run projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "openai-agents>=0.2.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100

[tool.uv]
dev-dependencies = ["httpx>=0.27.0", "ruff>=0.6.0"]
