<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HerzBrücke Printdeck</title><style>:root{--ink:#221b17;--muted:#74655a;--line:#eadbc8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff7ee;color:var(--ink)}.screen{padding:28px;max-width:1040px;margin:auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}h1{font-size:clamp(40px,7vw,86px);letter-spacing:-.075em;line-height:1;margin:0}p{color:var(--muted);line-height:1.55}.btn{display:inline-flex;padding:13px 18px;border-radius:999px;background:#221b17;color:white;text-decoration:none;font-weight:850;border:0;cursor:pointer;margin:4px}.btn.soft{background:#fff;color:#221b17;border:1px solid var(--line)}.toolbar{position:sticky;top:10px;z-index:5;background:rgba(255,247,238,.86);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0}.note{padding:14px;border:1px solid var(--line);border-radius:20px;background:#fff;margin:16px 0}.pages{display:grid;gap:24px}.sheet{width:210mm;min-height:297mm;margin:0 auto;background:white;box-shadow:0 18px 50px rgba(72,42,14,.12);padding:10mm;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:88mm;gap:4mm;page-break-after:always}.card{position:relative;border:1px dashed #d9c5ad;border-radius:8mm;padding:6mm;overflow:hidden;background:linear-gradient(145deg,#fffefb,#fff7ef)}.card.de{background:linear-gradient(145deg,#fffefb,#fff1f5)}.card.vi{background:linear-gradient(145deg,#fffefb,#eef9ff)}.card.guide{background:linear-gradient(145deg,#2a211c,#47372c);color:white;border-color:#5b4637}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(234,219,200,.8);font-size:8px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:#846f5e}.guide .badge{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18)}.word{font-size:26px;line-height:1.03;letter-spacing:-.06em;font-weight:950;margin-top:16mm}.sub{font-size:10px;line-height:1.4;color:#65584e;margin-top:4mm}.guide .sub{color:#ead9ca}.heart{position:absolute;right:6mm;bottom:4mm;font-size:36px;opacity:.16}.back{background:linear-gradient(145deg,#fffefb,#fff7ed)}.back h3{font-size:18px;margin:0 0 5mm;letter-spacing:-.03em}.section{padding:3mm 0;border-top:1px solid rgba(234,219,200,.75)}.section b{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#7b6859;margin-bottom:1.5mm}.section span{font-size:8.5px;line-height:1.35;display:block;color:#2a211c}.qr{position:absolute;right:6mm;bottom:6mm;font-size:8px;width:28mm;line-height:1.25;color:#ead9ca}@page{size:A4;margin:0}@media print{body{background:white}.screen,.toolbar{display:none!important}.sheet{box-shadow:none;margin:0;padding:10mm;width:210mm;height:297mm;break-after:page}}</style></head><body><div class="screen"><div class="top"><div><h1>HerzBrücke Printdeck</h1><p>Deutsch + Tiếng Việt. Im Browser drucken oder als PDF speichern. A4, Hochformat, 100%, Hintergrundgrafiken aktivieren.</p></div><a class="btn soft" href="../">Zur App</a></div><div class="toolbar"><div><button class="btn" onclick="window.print()">Drucken / PDF speichern</button><a class="btn soft" href="../feedback/">Feedback</a></div><div><button class="btn soft" onclick="show('fronts')">Nur Vorderseiten</button><button class="btn soft" onclick="show('backs')">Nur Rückseiten</button><button class="btn soft" onclick="show('all')">Alles</button></div></div><div class="note"><b>Hinweis:</b> Die Wortkarten werden gespielt: Deutsch ↔ Tiếng Việt. Die Guide-Karten sind fürs Gespräch danach.</div></div><main class="pages" id="pages"></main><script>const EMOTIONS=[['Freude','Niềm vui','teilen, spielen, feiern','chia sẻ, chơi, ăn mừng','Wann hast du zuletzt echte Freude gespürt?','Điều gì làm trái tim con nhảy lên?'],['Ruhe','Bình yên','Zeit, Stille, Sicherheit','thời gian, yên lặng, an toàn','Was hilft dir, ruhiger zu werden?','Nơi bình yên của con ở đâu?'],['Liebe','Tình yêu','Nähe, Vertrauen, Ausdruck','gần gũi, tin tưởng, bày tỏ','Woran merkst du, dass du geliebt wirst?','Làm sao con/em biết mình được yêu?'],['Dankbarkeit','Biết ơn','anerkennen, danken, erinnern','nhìn nhận, cảm ơn, ghi nhớ','Wofür bist du heute dankbar?','Hôm nay con/em biết ơn điều gì?'],['Traurigkeit','Buồn bã','Trost, Nähe, Zeit','an ủi, gần gũi, thời gian','Was brauchst du, wenn du traurig bist?','Khi buồn, con/em cần điều gì?'],['Angst','Nỗi sợ','Sicherheit, Erklärung, Schutz','an toàn, giải thích, bảo vệ','Was würde dir jetzt Sicherheit geben?','Điều gì làm nỗi sợ nhỏ lại?'],['Wut','Tức giận','Grenzen, Respekt, Bewegung','ranh giới, tôn trọng, vận động','Welche Grenze wurde berührt?','Ranh giới nào đã bị chạm vào?'],['Scham','Xấu hổ','Würde, Sanftheit, nicht ausgelacht werden','phẩm giá, dịu dàng, không bị cười nhạo','Was soll jemand jetzt sanft sagen?','Điều gì giúp con khi thấy xấu hổ?'],['Einsamkeit','Cô đơn','gesehen werden, Kontakt, Einladung','được nhìn thấy, kết nối, được mời gọi','Von wem möchtest du gesehen werden?','Con muốn ai nhìn thấy mình?'],['Verwirrung','Bối rối','Klarheit, Schritte, Erklärung','rõ ràng, từng bước chậm, giải thích','Welche Sache möchtest du zuerst verstehen?','Con muốn hỏi câu gì?'],['Sehnsucht','Khao khát','ehrlich wünschen, hoffen, verbunden bleiben','ước muốn thật lòng, hy vọng, giữ kết nối','Wonach sehnt sich dein Herz?','Trái tim con/em khao khát điều gì?'],['Erleichterung','Nhẹ nhõm','Pause, ankommen, feiern','nghỉ ngơi, trở về, mừng vì đã qua','Was darf jetzt leichter werden?','Điều gì bây giờ có thể nhẹ hơn?']];const URL='https://mikelninh.github.io/herzbruecke-family-tools/';const pages=document.getElementById('pages');function chunk(a,n){return Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n))}function word(e,type){return `<div class="card ${type} fronts"><span class="badge">${type==='de'?'Wortkarte · Deutsch':'Lá từ · Tiếng Việt'}</span><div class="word">${type==='de'?e[0]:e[1]}</div><p class="sub">${type==='de'?'Suche die vietnamesische Partnerkarte.':'Ghép với lá bài tiếng Đức.'}</p><div class="heart">♥</div></div>`}function guide(e){return `<div class="card guide fronts"><span class="badge">Guide · ${e[0]}</span><div class="word">Was brauchst du?</div><p class="sub">Körper · Bedürfnis · Frage<br>Cơ thể · Nhu cầu · Câu hỏi</p><div class="qr">Online spielen:<br>${URL}</div></div>`}function back(){return `<div class="card back backs"><h3>HerzBrücke</h3><p class="sub">Sprich dein Herz.<br>Nói bằng trái tim.</p><div class="section"><b>Spiel</b><span>Finde die deutsche und vietnamesische Partnerkarte.</span></div><div class="section"><b>Nach dem Match</b><span>Ziehe die passende Guide-Karte und stelle eine Frage.</span></div><div class="heart">♥</div></div>`}function guideBack(e){return `<div class="card back backs"><h3>${e[0]}<br>${e[1]}</h3><div class="section"><b>Bedürfnis · Nhu cầu</b><span>${e[2]} / ${e[3]}</span></div><div class="section"><b>Frage</b><span>${e[4]}<br>${e[5]}</span></div></div>`}function sheet(cards,cls){chunk(cards,9).forEach(pg=>pages.insertAdjacentHTML('beforeend',`<section class="sheet ${cls}Sheet">${pg.join('')}</section>`))}function render(){let f=[],b=[];EMOTIONS.forEach(e=>{f.push(word(e,'de'),word(e,'vi'));b.push(back(),back())});EMOTIONS.forEach(e=>{f.push(guide(e));b.push(guideBack(e))});sheet(f,'fronts');sheet(b,'backs')}function show(mode){document.querySelectorAll('.frontsSheet').forEach(x=>x.style.display=mode==='backs'?'none':'grid');document.querySelectorAll('.backsSheet').forEach(x=>x.style.display=mode==='fronts'?'none':'grid')}render();</script></body></html>
