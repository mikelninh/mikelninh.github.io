<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#070810" />
  <title>Tiny Tactics — Friends RC1</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070810;color:#f7f4ed}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(167,139,250,.15),transparent 35%),#070810}.boot{width:min(480px,100%);padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(20,22,31,.82);box-shadow:0 28px 90px rgba(0,0,0,.45);text-align:center}.mark{width:52px;height:52px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;background:#d8ff72;color:#11140a;font-size:24px;font-weight:900}.boot h1{margin:0;font-size:25px;letter-spacing:-.04em}.boot p{margin:8px 0 18px;color:#b6b7c6;font-size:14px;line-height:1.5}.bar{height:5px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}.bar i{display:block;width:38%;height:100%;background:#d8ff72;animation:load 1.1s ease-in-out infinite alternate}.status{margin-top:12px;color:#8f91a2;font-size:12px}@keyframes load{to{transform:translateX(165%)}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
  </style>
</head>
<body>
  <main class="boot" id="boot" aria-live="polite">
    <div class="mark">✦</div>
    <h1>Opening Tiny Tactics</h1>
    <p>Friends RC1 · the private friend-test candidate.</p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="status" id="status">Loading the verified build…</div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    if(!('DecompressionStream' in window)) throw new Error('Please open this playtest in a current Chrome, Safari, Edge, or Firefox browser.');
    const files=['0a','0b','0c','0d','1','2a','2b','2c','2d','3','4','5'];
    const parts=[];
    for(let i=0;i<files.length;i++){
      status.textContent=`Loading playtest ${i+1}/${files.length}…`;
      const response=await fetch(`./chunks/${files[i]}.txt`,{cache:'no-store'});
      if(!response.ok) throw new Error(`Playtest package ${i+1}/${files.length} could not be loaded.`);
      parts.push((await response.text()).trim());
    }
    const b64=parts.join('');
    if(b64.length!==103404) throw new Error('Playtest package failed its size check.');
    const compressed=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const digest=await crypto.subtle.digest('SHA-256',compressed);
    const hex=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
    if(hex!=='b5b73505a70ccb5afefd182162c954d63e6e2e8d7aa77642c17e8a7e41bd8e05') throw new Error('Playtest package failed its integrity check.');
    status.textContent='Starting the arena…';
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('Tiny Tactics')||!html.includes('Friends RC1')) throw new Error('Unexpected build identity.');
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    const boot=document.getElementById('boot');
    boot.innerHTML=`<div class="mark">!</div><h1>Could not open the playtest</h1><p>${String(error.message||error)}</p><p style="font-size:12px">Reload once. If it still fails, send Michael a screenshot of this message.</p>`;
  });
  </script>
</body>
</html>
