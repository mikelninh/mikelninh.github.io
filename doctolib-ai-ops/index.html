<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Operations Workbench — Michael Ninh</title>
<meta name="description" content="Minimal production-style AI operations work sample: AI prepares routine work and the operator takes one clear next action.">
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fb;--card:#fff;--blue:#2457d6;--blue-soft:#eef3ff;--navy:#10243f;--green:#087a57;--green-soft:#ecf9f3;--amber:#9a5b08;--amber-soft:#fff7e8;--red:#b42318;--shadow:0 16px 40px rgba(15,23,42,.07);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,textarea{font:inherit}.app{max-width:940px;margin:auto;padding:30px 22px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.top h1{font-size:30px;letter-spacing:-.04em;margin:0}.top p{font-size:16px;color:var(--muted);margin:6px 0 0}.top a{font-size:14px;font-weight:800;color:#1a4c98;text-decoration:none;padding-top:8px}.cases{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 14px}.case-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;color:#334155}.case-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:24px 26px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.card-head h2{font-size:30px;letter-spacing:-.035em;margin:0}.card-head p{font-size:15px;color:var(--muted);margin:6px 0 0}.status{font-size:12px;font-weight:900;border-radius:999px;padding:7px 10px;white-space:nowrap}.ready{background:#eaf0ff;color:#244f9f}.blocked{background:#fff0dc;color:#945400}.waiting{background:#f1f3f6;color:#5d6a7c}.done{background:#e9f7f1;color:#08724f}.escalated{background:#feeceb;color:#a82119}.body{padding:26px}.prep{border-radius:18px;padding:18px 20px;background:var(--blue-soft);border:1px solid #d7e2ff}.prep.blocked-prep{background:var(--amber-soft);border-color:#edd2a2}.prep.done-prep{background:var(--green-soft);border-color:#cce9dc}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#31589e}.prep.blocked-prep .eyebrow{color:var(--amber)}.prep.done-prep .eyebrow{color:var(--green)}.prep h3{font-size:22px;margin:5px 0 5px;letter-spacing:-.02em}.prep p{font-size:15px;color:#53637a;line-height:1.5;margin:0}.action{margin-top:24px}.action-label{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#31589e}.action h3{font-size:32px;line-height:1.08;letter-spacing:-.04em;margin:7px 0 9px}.action p{font-size:16px;line-height:1.55;color:#53637a;max-width:760px;margin:0}.owner{margin-top:12px;font-size:14px;color:#475569}.owner b{color:var(--ink)}.draft{margin-top:20px}.draft label{display:block;font-size:14px;font-weight:850;margin-bottom:8px}.draft textarea{width:100%;min-height:130px;border:1px solid #d5deea;border-radius:14px;padding:15px 16px;font-size:16px;line-height:1.6;color:var(--ink);background:#fff;resize:vertical;outline:none}.draft textarea:focus{border-color:#9db6f3;box-shadow:0 0 0 3px rgba(36,87,214,.08)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border-radius:12px;padding:13px 17px;font-size:15px;font-weight:900;cursor:pointer}.primary{background:var(--blue);border:1px solid var(--blue);color:#fff}.danger{background:#fff;border:1px solid #f1c6c1;color:var(--red)}.next{background:var(--navy);border:1px solid var(--navy);color:#fff}.result{display:none;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.result.show{display:grid}.result div{background:#fff;border:1px solid #d7e9df;border-radius:12px;padding:13px}.result b{font-size:11px;text-transform:uppercase;color:var(--muted);display:block}.result span{font-size:14px;font-weight:850;display:block;margin-top:3px}.details{margin-top:20px}details{border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font-size:14px;font-weight:850;color:#475569;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'+';display:inline-block;width:20px;color:#64748b}details[open] summary::before{content:'−'}.detail{font-size:14px;line-height:1.55;color:#53637a;padding:12px 0 0 20px}.detail ul{margin:0;padding-left:18px}.detail li{margin:5px 0}.foot{margin-top:16px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:640px){.app{padding:20px 14px 36px}.top{flex-direction:column}.top h1{font-size:26px}.card-head{flex-direction:column}.body{padding:20px}.action h3{font-size:27px}.result{grid-template-columns:1fr}.case-tab{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>AI Operations Workbench</h1><p>AI does the prep. You make the decision.</p></div>
    <a href="https://github.com/mikelninh/digital-worker-factory" target="_blank" rel="noreferrer">Source ↗</a>
  </header>

  <nav class="cases" id="caseTabs"></nav>

  <main class="card">
    <div class="card-head">
      <div><h2 id="caseTitle"></h2><p id="caseSub"></p></div>
      <span class="status" id="caseStatus"></span>
    </div>

    <div class="body">
      <section class="prep" id="prepBox">
        <div class="eyebrow" id="prepLabel"></div>
        <h3 id="prepTitle"></h3>
        <p id="prepCopy"></p>
      </section>

      <section class="action">
        <div class="action-label">Your next action</div>
        <h3 id="actionTitle"></h3>
        <p id="actionCopy"></p>
        <div class="owner" id="owner"></div>

        <div class="draft" id="draftWrap">
          <label for="draftText">AI-prepared draft</label>
          <textarea id="draftText"></textarea>
        </div>

        <div class="actions" id="actions"></div>
        <div class="result" id="result"></div>
      </section>

      <div class="details">
        <details>
          <summary>Why this recommendation?</summary>
          <div class="detail" id="detail"></div>
        </details>
      </div>
    </div>
  </main>

  <div class="foot">Synthetic work sample · no official Doctolib product UI or data · no internal architecture or production-performance claims.</div>
</div>

<script>
const cases={
 westend:{title:'Clinic Westend',short:'Clinic Westend',sub:'Activation follow-up · due in 3h 36m',status:'ready',prepLabel:'AI PREP COMPLETE',prepTitle:'Ready for your review',prepCopy:'CRM, policy and recent support history are current. AI prepared the follow-up.',actionTitle:'Approve the activation follow-up',actionCopy:'Review the draft below. Edit it if needed, then approve to create the follow-up task.',owner:'You · Operations',draft:'Hi Clinic Westend — your technical checklist is complete. The remaining step is the final activation call. I can offer a 15-minute slot tomorrow at 10:30 or 14:00. Which works better?',primary:'Approve & create follow-up',primaryAction:'approve',detail:['CRM account — current','Implementation policy — current','Recent support history — current'],result:[['Task','Activation follow-up'],['Assigned to','You'],['Due','Tomorrow']]},
 mitte:{title:'Praxis Berlin Mitte',short:'Berlin Mitte',sub:'Activation follow-up · due in 1h 09m',status:'blocked',prepLabel:'AI STOPPED',prepTitle:'CRM information is too old',prepCopy:'The account note is 19 days old, so the system did not draft customer outreach.',actionTitle:'Request a CRM refresh',actionCopy:'Ask the account owner to refresh the CRM state. The case can return automatically when the source is current.',owner:'CS-08 · Customer Success',draft:'',primary:'Request CRM refresh',primaryAction:'refresh',detail:['CRM account — stale (19 days)','Implementation policy — current','Recent support history — current'],result:[['Task','Refresh CRM state'],['Assigned to','CS-08'],['Status','Waiting']]},
 park:{title:'Praxis am Park',short:'Praxis am Park',sub:'Policy question · due today',status:'blocked',prepLabel:'AI STOPPED',prepTitle:'Required policy is missing',prepCopy:'A required source is missing, so the system did not invent a recommendation.',actionTitle:'Create the missing-policy task',actionCopy:'Route the evidence gap to Implementation. When the policy is attached, the case can re-enter review.',owner:'Impl-04 · Implementation',draft:'',primary:'Create policy task',primaryAction:'policy',detail:['CRM account — current','Implementation policy — missing','Recent support history — current'],result:[['Task','Attach policy'],['Assigned to','Impl-04'],['Status','Waiting']]}
};
let active='westend';
function statusLabel(s){return s==='ready'?'READY':s==='blocked'?'BLOCKED':s==='waiting'?'WAITING':s==='done'?'DONE':'ESCALATED'}
function renderTabs(){document.querySelector('#caseTabs').innerHTML=Object.entries(cases).map(([id,c])=>`<button class="case-tab ${id===active?'active':''}" data-id="${id}">${c.short}</button>`).join('');document.querySelectorAll('.case-tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render();});}
function render(){const c=cases[active];renderTabs();document.querySelector('#caseTitle').textContent=c.title;document.querySelector('#caseSub').textContent=c.sub;const st=document.querySelector('#caseStatus');st.textContent=statusLabel(c.status);st.className=`status ${c.status}`;const prep=document.querySelector('#prepBox');prep.className=`prep ${c.status==='blocked'?'blocked-prep':c.status==='done'||c.status==='waiting'||c.status==='escalated'?'done-prep':''}`;document.querySelector('#prepLabel').textContent=c.status==='done'?'DONE':c.status==='waiting'?'TASK CREATED':c.status==='escalated'?'ESCALATED':c.prepLabel;document.querySelector('#prepTitle').textContent=c.status==='done'?'Follow-up task created':c.status==='waiting'?'Next task created':c.status==='escalated'?'Case escalated':c.prepTitle;document.querySelector('#prepCopy').textContent=c.status==='done'?'The decision is recorded and the follow-up is now owned work.':c.status==='waiting'?'The blocker now has an owner. No further action is needed until they update the source.':c.status==='escalated'?'The case has been routed for manual review.':c.prepCopy;document.querySelector('#actionTitle').textContent=c.status==='done'||c.status==='waiting'||c.status==='escalated'?'Move to the next case':c.actionTitle;document.querySelector('#actionCopy').textContent=c.status==='done'||c.status==='waiting'||c.status==='escalated'?'This case can leave your active queue.':c.actionCopy;document.querySelector('#owner').innerHTML=`<b>Owner:</b> ${c.status==='done'?'You · Operations':c.status==='escalated'?'Senior Operations':c.owner}`;const dw=document.querySelector('#draftWrap');dw.style.display=c.draft&&c.status==='ready'?'block':'none';document.querySelector('#draftText').value=c.draft||'';document.querySelector('#detail').innerHTML=`<ul>${c.detail.map(x=>`<li>${x}</li>`).join('')}</ul>`;const result=document.querySelector('#result');if(['done','waiting','escalated'].includes(c.status)){const rows=c.status==='escalated'?[['Route','Senior Operations'],['Status','Escalated'],['Next','Manual review']]:c.result;result.innerHTML=rows.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('');result.className='result show';document.querySelector('#actions').innerHTML='<button class="btn next" data-action="next">Open next case →</button>';}else{result.className='result';result.innerHTML='';document.querySelector('#actions').innerHTML=`<button class="btn primary" data-action="${c.primaryAction}">${c.primary}</button><button class="btn danger" data-action="escalate">Escalate</button>`;}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));}
function act(action){const c=cases[active];if(action==='next'){const ids=Object.keys(cases);const remaining=ids.filter(id=>!['done','waiting','escalated'].includes(cases[id].status));active=remaining[0]||ids[(ids.indexOf(active)+1)%ids.length];render();return;}if(action==='approve')c.status='done';if(action==='refresh'||action==='policy')c.status='waiting';if(action==='escalate')c.status='escalated';render();}
render();
</script>
</body>
</html>
