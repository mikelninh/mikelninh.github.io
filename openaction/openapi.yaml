openapi: 3.1.0
info:
  title: OpenAction Gateway
  version: 0.2.0
  description: Minimal HTTP contract for proposing, approving and completing OpenAction actions. Implement this in any stack; the reference site does not require a central OpenAction server.
servers:
  - url: https://example.org/openaction
paths:
  /v1/actions:
    post:
      summary: Propose an action
      operationId: proposeAction
      requestBody:
        required: true
        content:
          application/vnd.openaction+json:
            schema:
              $ref: ./spec/0.2/openaction.schema.json
      responses:
        '202':
          description: Action accepted for policy/approval processing
          content:
            application/vnd.openaction+json:
              schema:
                $ref: ./spec/0.2/openaction.schema.json
  /v1/actions/{actionId}:
    get:
      summary: Read current action state
      operationId: getAction
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current OpenAction object
          content:
            application/vnd.openaction+json:
              schema:
                $ref: ./spec/0.2/openaction.schema.json
  /v1/actions/{actionId}/approve:
    post:
      summary: Record explicit approval
      operationId: approveAction
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by]
              properties:
                by:
                  type: object
                  required: [type, id]
                  properties:
                    type: { enum: [human, qualified_human] }
                    id: { type: string }
      responses:
        '200': { description: Approved action }
        '409': { description: Approval policy not satisfied }
  /v1/actions/{actionId}/complete:
    post:
      summary: Record a real-world outcome
      operationId: completeAction
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, summary]
              properties:
                status: { enum: [succeeded, failed, partial, unknown] }
                summary: { type: string }
                receipt: { type: string }
                metrics: { type: object, additionalProperties: true }
      responses:
        '200': { description: Completed action with outcome }
webhooks:
  actionEvent:
    post:
      summary: Optional CloudEvents delivery of OpenAction lifecycle changes
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              type: object
      responses:
        '204': { description: Event accepted }
